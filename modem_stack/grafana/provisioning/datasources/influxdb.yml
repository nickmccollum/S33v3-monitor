apiVersion: 1

datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    jsonData:
      version: Flux
      organization: home
      defaultBucket: modem
      tlsSkipVerify: true
    secureJsonData:
      # IMPORTANT: Replace this placeholder with your actual INFLUX_TOKEN from .env
      # Grafana provisioning doesn't support env var substitution, so you must:
      # 1. Copy your INFLUX_TOKEN from .env
      # 2. Replace "REPLACE_WITH_YOUR_INFLUX_TOKEN" below
      # 3. Or configure the datasource manually in Grafana UI (editable: true allows this)
      token: REPLACE_WITH_YOUR_INFLUX_TOKEN
    isDefault: true
    editable: true
